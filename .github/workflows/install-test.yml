name: install-test (sans build Xojo)
on:
  workflow_dispatch:
  push:
    paths: ["tools-packaging/**", ".github/workflows/install-test.yml"]
jobs:
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier dist
        run: ls -la "Builds - AG/dist/" || echo "dist absent (artefacts CI requis)"
      - name: Extraire tgz Linux
        run: |
          TGZ=$(ls "Builds - AG/dist/"AG2-*-linux-*.tgz 2>/dev/null | sed -n 1p || true)
          if [ -z "$TGZ" ]; then echo "dist absent, skip (build IDE requis)"; exit 0; fi
          mkdir -p /tmp/ag2 && tar -xzf "$TGZ" -C /tmp/ag2
      - name: Binaire executable
        run: |
          BIN=$(find /tmp/ag2 -maxdepth 4 -name AG2 -type f -print -quit)
          echo "BIN=$BIN"
          test -n "$BIN" || { echo "binaire introuvable"; exit 1; }
          chmod +x "$BIN"
          test -x "$BIN"
      - name: ldd sans missing
        run: |
          BIN=$(find /tmp/ag2 -maxdepth 4 -name AG2 -type f -print -quit)
          MISS=$(ldd "$BIN" 2>&1 | grep -i "not found" || true)
          echo "MISS=$MISS"
          test -z "$MISS"
      - name: Lancement --help/--version
        run: |
          BIN=$(find /tmp/ag2 -maxdepth 4 -name AG2 -type f -print -quit)
          timeout 15 "$BIN" --help || timeout 15 "$BIN" --version
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire tgz macOS
        run: |
          TGZ=$(ls "Builds - AG/dist/"AG2-*-macos-*.tgz 2>/dev/null | sed -n 1p || true)
          if [ -z "$TGZ" ]; then echo "dist absent, skip (build IDE requis)"; exit 0; fi
          mkdir -p /tmp/ag2 && tar -xzf "$TGZ" -C /tmp/ag2
          ls /tmp/ag2
      - name: Smoke macOS
        run: bash tools-packaging/test-macos-smoke.sh "" 15
